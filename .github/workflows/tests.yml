name: Platform and official benchmark
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ''
      LLM_STRICT: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=reports/platform-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-test-results
          path: reports/platform-tests.xml
